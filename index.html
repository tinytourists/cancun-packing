<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121514" media="(prefers-color-scheme: dark)">
<title>Packing list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column. Calm stone ground, white cards; each family owns one quiet colour (eucalyptus / plum), shared items are ochre. Sticky filter bar, floating add button, bottom-sheet editor. */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --raised:#f7f8f6; --ink:#1d2321; --muted:#66706b; --line:#e1e4df;
  --a:#3d6b5c; --a-soft:#e3ece7; --b:#7d4f6d; --b-soft:#f0e6ec; --s:#94753a; --s-soft:#f3ecdc;
  --danger:#a6463a; --on-accent:#ffffff; --shadow:0 1px 2px rgba(29,35,33,.06),0 8px 24px rgba(29,35,33,.08);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121514; --surface:#1a1e1d; --raised:#202524; --ink:#e6e8e4; --muted:#9aa39e; --line:#2a302e;
  --a:#8db5a6; --a-soft:#22302b; --b:#c29bb5; --b-soft:#33262f; --s:#c9ad72; --s-soft:#302a1d;
  --danger:#dd8f82; --on-accent:#121514; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.col{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Lock screen */
.gate{min-height:100svh;display:grid;place-items:center;padding-block:24px}
.gate form{width:100%;max-width:380px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.gate .lock{width:44px;height:44px;border-radius:12px;background:var(--raised);display:grid;place-items:center;color:var(--muted)}
.gate h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.gate p{margin:0;color:var(--muted);font-size:15px}
.field{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:13px 14px;font-size:16px}
.field:focus{outline:none;border-color:var(--ink)}
.primary{border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;padding:14px;font-size:16px}
.primary:disabled{opacity:.5}
.err{color:var(--danger);font-size:14px;margin:0}

/* Header */
.top{padding-block:20px 6px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1.title{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,7vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.count{flex-shrink:0;text-align:right;line-height:1.1}
.count b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.count span{font-size:12px;color:var(--muted)}
.fams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fam{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.fam .who{font-weight:700;font-size:15px;line-height:1.25;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--a)}
.fam.B .dot{background:var(--b)}
.fam .route{font-size:13px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--a);border-radius:3px;transition:width .35s}
.fam.B .meter i{background:var(--b)}
.fam small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.fam small b{color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:12.5px;color:var(--muted);background:var(--surface);border-radius:999px;padding:5px 10px}
.fact b{color:var(--ink);font-weight:600}

/* Sticky toolbar */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;margin-top:-1px}
.bar .col{display:flex;gap:8px;align-items:center}
.seg{flex:1;min-width:0;display:flex;background:var(--surface);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:9px 4px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button#vA[aria-pressed="true"]{background:var(--a);color:var(--on-accent)}
.seg button#vB[aria-pressed="true"]{background:var(--b);color:var(--on-accent)}
.toggle{flex-shrink:0;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:0 12px;height:42px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.toggle[aria-pressed="true"]{color:var(--ink)}
.toggle .box{width:16px;height:16px;border-radius:5px;border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px;line-height:1}

/* List */
.lists{display:flex;flex-direction:column;gap:14px;padding-block:6px 120px}
.cat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.cat>button{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left}
.cat>button .name{flex:1;min-width:0;font-weight:700;font-size:15px}
.cat>button .tally{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat>button .chev{color:var(--muted);transition:transform .2s;font-size:14px}
.cat.closed>button .chev{transform:rotate(-90deg)}
.cat.closed .items{display:none}
.cat.complete>button .tally{color:var(--a)}
.items{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 6px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.ticks{display:flex;flex-shrink:0}
.tick{width:44px;height:48px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.tick span{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);transition:background .15s,border-color .15s}
.tick[data-f="A"] span{border-color:var(--a);color:var(--a)}
.tick[data-f="B"] span{border-color:var(--b);color:var(--b)}
.tick[data-f="S"] span{border-color:var(--s)}
.tick[aria-pressed="true"] span{color:var(--on-accent)}
.tick[aria-pressed="true"][data-f="A"] span{background:var(--a)}
.tick[aria-pressed="true"][data-f="B"] span{background:var(--b)}
.tick[aria-pressed="true"][data-f="S"] span{background:var(--s);border-color:var(--s)}
.item{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:10px 4px;display:flex;align-items:center;gap:8px;min-height:48px}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
.row.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);text-decoration-thickness:2px}
.tag{flex-shrink:0;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--raised);color:var(--muted)}
.tag.A{background:var(--a-soft);color:var(--a)} .tag.B{background:var(--b-soft);color:var(--b)} .tag.shared{background:var(--s-soft);color:var(--s)}
.empty{background:var(--surface);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted)}
.note{background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.note summary{padding:14px 16px;font-weight:700;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.note summary::-webkit-details-marker{display:none}
.note summary::after{content:"›";color:var(--muted);transform:rotate(90deg)}
.note[open] summary::after{transform:rotate(-90deg)}
.note p{margin:0;padding:0 16px 14px;font-size:14px;color:var(--muted)}
.linkbtn{align-self:center;border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px}

/* Add button */
.fab{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;padding:0 20px;height:54px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab span{font-size:22px;line-height:1;margin-top:-2px}

/* Sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:var(--shadow)}
dialog.sheet::backdrop{background:rgba(10,14,13,.45)}
.sheet form{padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
.who-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who-opts label{position:relative;display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.who-opts input{position:absolute;opacity:0;pointer-events:none}
.who-opts b{font-size:14px} .who-opts small{font-size:12px;color:var(--muted)}
.who-opts label:has(input:checked){border-color:var(--ink);background:var(--raised)}
.who-opts label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.actions{display:flex;gap:10px}
.actions .primary{flex:1}
.ghost{border:1px solid var(--line);background:transparent;border-radius:12px;padding:0 16px;font-weight:600;font-size:15px}
.ghost.danger{color:var(--danger)}
.ghost.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat}
@media (min-width:700px){
  dialog.sheet{margin:auto;border-radius:20px}
  .top{padding-top:36px}
  .row:hover{background:var(--raised)}
}
@media (max-width:360px){.fams{grid-template-columns:1fr}.toggle .lbltxt{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="gate col" id="gate">
  <form id="gateForm" autocomplete="off">
    <div class="lock" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>Private list</h1>
    <p>Enter the password to open it. This phone will remember it.</p>
    <input class="field" id="pw" type="password" placeholder="Password" aria-label="Password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <button class="primary" id="gateBtn" type="submit">Unlock</button>
    <p class="err" id="gateErr" hidden>That's not it. Check the password and try again.</p>
  </form>
</section>

<div id="app" hidden>
  <header class="top col">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="titlerow">
      <h1 class="title" id="title"></h1>
      <div class="count"><b id="days">–</b><span>days to go</span></div>
    </div>
    <div class="fams">
      <div class="fam A"><div class="who"><span class="dot"></span><span id="whoA"></span></div><div class="route" id="routeA"></div><div class="meter"><i id="barA"></i></div><small id="cntA"></small></div>
      <div class="fam B"><div class="who"><span class="dot"></span><span id="whoB"></span></div><div class="route" id="routeB"></div><div class="meter"><i id="barB"></i></div><small id="cntB"></small></div>
    </div>
    <div class="facts" id="facts"></div>
  </header>

  <div class="bar">
    <div class="col">
      <div class="seg" role="group" aria-label="Show items for">
        <button id="vAll" aria-pressed="true">All</button>
        <button id="vA" aria-pressed="false"></button>
        <button id="vB" aria-pressed="false"></button>
      </div>
      <button class="toggle" id="hideBtn" aria-pressed="false"><span class="box" id="hideBox"></span><span class="lbltxt">Hide packed</span></button>
    </div>
  </div>

  <main class="col">
    <div class="lists">
      <div id="list"><div class="empty">Loading the list…</div></div>
      <details class="note" id="note"><summary>Leave these at home</summary></details>
      <button class="linkbtn" id="lockBtn" type="button">Lock this phone</button>
    </div>
  </main>

  <button class="fab" id="addBtn" type="button" aria-label="Add an item"><span>+</span>Add</button>
</div>

<dialog class="sheet" id="sheet">
  <form id="sheetForm" method="dialog" autocomplete="off">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="sheetTitle">Add an item</h2>
    <div><label class="lbl" for="fText">Item</label><input class="field" id="fText" maxlength="120" placeholder="e.g. sippy cups" required></div>
    <div><label class="lbl" for="fCat">Section</label><select class="field" id="fCat"></select></div>
    <div><span class="lbl" id="whoLbl">Who brings it</span><div class="who-opts" id="fOwner" role="radiogroup" aria-labelledby="whoLbl"></div></div>
    <p class="err" id="sheetErr" hidden></p>
    <div class="actions">
      <button class="ghost danger" id="delBtn" type="button" hidden>Delete</button>
      <button class="ghost" id="cancelBtn" type="button">Cancel</button>
      <button class="primary" id="saveBtn" type="submit">Save</button>
    </div>
  </form>
</dialog>

<script type="module">
//__STORE_START__
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, updateDoc, deleteDoc, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBc-CsPB1JHgXAoEomn2lXp6EiymSdh8Gg",
  authDomain: "cancun-packing.firebaseapp.com",
  projectId: "cancun-packing",
  storageBucket: "cancun-packing.firebasestorage.app",
  messagingSenderId: "129428921494",
  appId: "1:129428921494:web:89b3b5a9f95cba8771b6b7"
};
function openStore(key,seedItems,onItems,onError){
  const col=collection(getFirestore(initializeApp(FIREBASE_CONFIG)),"trips",key,"items");
  let seeded=false;
  onSnapshot(col,snap=>{
    if(snap.empty&&!snap.metadata.fromCache&&!seeded){seeded=true;
      const b=writeBatch(col.firestore);
      seedItems.forEach(([cat,owner,text],i)=>b.set(doc(col,"s"+String(i+1).padStart(2,"0")),{text,cat,owner,order:i+1,done:{}}));
      b.commit().catch(onError);}
    onItems(snap.docs.map(d=>({id:d.id,...d.data()})));
  },onError);
  return{
    update:(id,patch)=>updateDoc(doc(col,id),patch),
    remove:id=>deleteDoc(doc(col,id)),
    add:data=>setDoc(doc(col),data)
  };
}
//__STORE_END__

const STORE_KEY="pk-trip",PREF_KEY="pk-prefs";
const $=id=>document.getElementById(id);
let T=null,CATS=[],items=[],store=null,editing=null;
let prefs={view:"all",hide:false,closed:[]};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREF_KEY)||"{}"))}catch(_){}
const savePrefs=()=>{try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs))}catch(_){}};

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim().toLowerCase()),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(LOCK.salt),iterations:LOCK.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(LOCK.iv)},k,b64(LOCK.ct))));
}

const OWN=()=>[["each","Both families","Each packs their own"],["A",T.short.A,"Only "+T.names.A],["B",T.short.B,"Only "+T.names.B],["shared","Shared","One for everyone"]];
const tagText=o=>o==="each"?"Both":o==="shared"?"Shared":T.short[o];
const initial=f=>T.names[f].charAt(0);
function slotsFor(it){const o=it.owner||"each";if(o==="shared")return["S"];if(o!=="each")return[o];return prefs.view==="all"?["A","B"]:[prefs.view]}
const relevant=(it,f)=>{const o=it.owner||"each";return o==="each"||o==="shared"||o===f};
const isDone=(it,f)=>{const d=it.done||{};return(it.owner||"each")==="shared"?!!d.S:!!d[f]};
const rowDone=it=>slotsFor(it).every(s=>(it.done||{})[s]);

function start(trip){
  T=trip;
  CATS=[["docs","Documents & money"],["flight","Flight & carry-on"],["baby",T.kids.A],["toddler",T.kids.B],["beach","Beach & pool"],["health","Health kit"],["clothes","Clothes"],["tech","Tech & extras"]];
  document.title=T.title;
  $("eyebrow").textContent=T.eyebrow;$("title").textContent=T.title;
  ["A","B"].forEach(f=>{$("who"+f).textContent=T.names[f];$("route"+f).textContent="";$("route"+f).append(T.routes[f],document.createElement("br"),T.dates[f]);$("v"+f).textContent=T.short[f]});
  $("facts").innerHTML="";T.facts.forEach(([k,v])=>{const e=document.createElement("span");e.className="fact";e.append(k+" ");const b=document.createElement("b");b.textContent=v;e.append(b);$("facts").append(e)});
  T.provided.forEach(t=>{const p=document.createElement("p");p.textContent=t;$("note").append(p)});
  $("fCat").innerHTML="";CATS.forEach(([k,l])=>{const o=document.createElement("option");o.value=k;o.textContent=l;$("fCat").append(o)});
  $("fOwner").innerHTML="";OWN().forEach(([k,b,s],i)=>{const l=document.createElement("label");const r=document.createElement("input");r.type="radio";r.name="owner";r.value=k;r.id="o_"+k;
    const bb=document.createElement("b");bb.textContent=b;const ss=document.createElement("small");ss.textContent=s;l.append(r,bb,ss);$("fOwner").append(l)});
  $("gate").hidden=true;$("app").hidden=false;
  countdown();setInterval(countdown,6e4);render();
  store=openStore(T.key,T.seed,list=>{items=list;render()},()=>{$("list").innerHTML='<div class="empty">Couldn\'t load the list. Check your connection and reload.</div>'});
}

function countdown(){const d=Math.ceil((new Date(T.depart)-new Date())/864e5);$("days").textContent=d>0?d:"0"}

function render(){
  ["A","B"].forEach(f=>{const r=items.filter(i=>relevant(i,f)),d=r.filter(i=>isDone(i,f)).length;
    $("cnt"+f).innerHTML="";const b=document.createElement("b");b.textContent=d;$("cnt"+f).append(b," of "+r.length+" packed");
    $("bar"+f).style.width=(r.length?d/r.length*100:0)+"%"});
  ["all","A","B"].forEach(v=>$(v==="all"?"vAll":"v"+v).setAttribute("aria-pressed",String(prefs.view===v)));
  $("hideBtn").setAttribute("aria-pressed",String(prefs.hide));$("hideBox").textContent=prefs.hide?"✓":"";
  const host=$("list");host.innerHTML="";
  if(!items.length){host.innerHTML='<div class="empty">Setting up the list…</div>';return}
  const wrap=document.createElement("div");wrap.style.cssText="display:flex;flex-direction:column;gap:14px";
  let shownAny=false;
  CATS.forEach(([k,label])=>{
    const all=items.filter(i=>(i.cat||"tech")===k&&(prefs.view==="all"||relevant(i,prefs.view))).sort((a,b)=>(a.order??999)-(b.order??999)||String(a.text).localeCompare(b.text));
    if(!all.length)return;
    const done=all.filter(rowDone).length;
    const vis=prefs.hide?all.filter(i=>!rowDone(i)):all;
    const sec=document.createElement("section");sec.className="cat";
    if(prefs.closed.includes(k))sec.classList.add("closed");
    if(done===all.length)sec.classList.add("complete");
    const head=document.createElement("button");head.type="button";head.setAttribute("aria-expanded",String(!prefs.closed.includes(k)));
    const n=document.createElement("span");n.className="name";n.textContent=label;
    const t=document.createElement("span");t.className="tally";t.textContent=done===all.length?"All packed":done+" of "+all.length;
    const c=document.createElement("span");c.className="chev";c.textContent="▾";c.setAttribute("aria-hidden","true");
    head.append(n,t,c);head.onclick=()=>{prefs.closed=prefs.closed.includes(k)?prefs.closed.filter(x=>x!==k):[...prefs.closed,k];savePrefs();render()};
    sec.append(head);
    if(vis.length){
      const box=document.createElement("div");box.className="items";
      vis.forEach(it=>{
        const row=document.createElement("div");row.className="row";if(rowDone(it))row.classList.add("done");
        const ticks=document.createElement("div");ticks.className="ticks";const slots=slotsFor(it);
        slots.forEach(s=>{const on=!!(it.done||{})[s];const b=document.createElement("button");b.type="button";b.className="tick";b.dataset.f=s;b.setAttribute("aria-pressed",String(on));
          b.setAttribute("aria-label",(on?"Mark not packed: ":"Mark packed: ")+it.text+(s==="S"?"":" ("+T.names[s]+")"));
          const sp=document.createElement("span");sp.textContent=slots.length>1?initial(s):(on?"✓":"");b.append(sp);
          b.onclick=()=>act(()=>store.update(it.id,{["done."+s]:!on}));ticks.append(b)});
        const body=document.createElement("button");body.type="button";body.className="item";body.setAttribute("aria-label","Edit "+it.text);
        const tx=document.createElement("span");tx.className="txt";tx.textContent=it.text;
        const tg=document.createElement("span");const o=it.owner||"each";tg.className="tag "+o;tg.textContent=tagText(o);
        body.append(tx);if(o!=="each")body.append(tg);body.onclick=()=>openSheet(it);
        row.append(ticks,body);box.append(row)});
      sec.append(box);
    }
    wrap.append(sec);shownAny=true;
  });
  if(!shownAny){host.innerHTML='<div class="empty">Nothing here yet.</div>';return}
  host.append(wrap);
}

async function act(fn){try{await fn()}catch(e){toast("Couldn't save that. Check your connection.")}}
function toast(m){const e=$("sheetErr");if($("sheet").open){e.textContent=m;e.hidden=false}else{$("list").insertAdjacentHTML("afterbegin",'<div class="empty" style="color:var(--danger)"></div>');$("list").firstChild.textContent=m}}

function openSheet(it){
  editing=it||null;$("sheetErr").hidden=true;
  $("sheetTitle").textContent=it?"Edit item":"Add an item";
  $("fText").value=it?it.text:"";$("fCat").value=it?(it.cat||"tech"):($("fCat").value||"docs");
  const own=it?(it.owner||"each"):"each";$("o_"+own).checked=true;
  $("delBtn").hidden=!it;$("delBtn").classList.remove("armed");$("delBtn").textContent="Delete";
  $("saveBtn").textContent=it?"Save":"Add";
  $("sheet").showModal();if(!it)setTimeout(()=>$("fText").focus(),50);
}
$("addBtn").onclick=()=>openSheet(null);
$("cancelBtn").onclick=()=>$("sheet").close();
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))$("sheet").close()});
$("delBtn").onclick=async()=>{const b=$("delBtn");if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Tap to delete";return}
  const id=editing.id;$("sheet").close();await act(()=>store.remove(id))};
$("sheetForm").addEventListener("submit",async e=>{
  e.preventDefault();const text=$("fText").value.trim();if(!text)return;
  const data={text,cat:$("fCat").value,owner:(document.querySelector('input[name="owner"]:checked')||{}).value||"each"};
  $("saveBtn").disabled=true;
  try{if(editing)await store.update(editing.id,data);else await store.add({...data,order:500,done:{}});$("sheet").close()}
  catch(_){$("sheetErr").textContent="Couldn't save that. Check your connection.";$("sheetErr").hidden=false}
  finally{$("saveBtn").disabled=false}
});
["all","A","B"].forEach(v=>$(v==="all"?"vAll":"v"+v).onclick=()=>{prefs.view=v;savePrefs();render()});
$("hideBtn").onclick=()=>{prefs.hide=!prefs.hide;savePrefs();render()};
$("lockBtn").onclick=()=>{try{localStorage.removeItem(STORE_KEY)}catch(_){}location.reload()};

$("gateForm").addEventListener("submit",async e=>{
  e.preventDefault();$("gateErr").hidden=true;$("gateBtn").disabled=true;$("gateBtn").textContent="Unlocking…";
  try{const trip=await unlock($("pw").value);try{localStorage.setItem(STORE_KEY,JSON.stringify(trip))}catch(_){}start(trip)}
  catch(_){$("gateErr").hidden=false;$("pw").select()}
  finally{$("gateBtn").disabled=false;$("gateBtn").textContent="Unlock"}
});
let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE_KEY)||"null")}catch(_){}
if(saved&&saved.key&&saved.short)start(saved);
</script>
